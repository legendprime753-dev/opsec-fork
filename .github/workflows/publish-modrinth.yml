name: Publish to Modrinth

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Release type (release, beta, alpha)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - beta
          - alpha

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and Remap Mod JARs
        run: ./gradlew remapAll --stacktrace

      - name: Collect JAR files
        run: |
          mkdir -p dist
          find versions -path "*/build/libs/opsec-*.jar" ! -name "*-sources.jar" -exec cp {} dist/ \;
          ls -lh dist/

      - name: Publish to Modrinth
        uses: Kirun9/modrinth-upload@v0.1.2
        if: ${{ env.MODRINTH_TOKEN != '' }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project_id: 'opsec-fork'
          version_name: 'OpSec (Fork) v${{ github.ref_name }}'
          version_type: ${{ github.event.inputs.version_type || 'release' }}
          changelog: 'See GitHub Releases: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}'
          loaders: |
            fabric
          game_versions: |
            1.20.1
            1.20.2
            1.20.4
            1.20.6
            1.21
            1.21.1
            1.21.4
            1.21.6
            1.21.9
            1.21.11
            26.1
            26.2
          files: |
            dist/*.jar
